name: FilePilot CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: cargo test --all --verbose

  build-release:
    name: Build Release Binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: filepilot-cli.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: filepilot-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: filepilot-cli
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: filepilot-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Release
        run: cargo build -p filepilot-cli --release --target ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
