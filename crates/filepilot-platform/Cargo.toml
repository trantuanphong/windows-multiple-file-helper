[package]
name = "filepilot-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_IO",
] }
